<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Lab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>CSS Exercises</h1>

    <h2>1. CSS Selectors</h2>
    <p class="important">An important paragraph</p>

    <h2>2. CSS Box Model</h2>
    <div class="card-a">Card A: content-box</div>
    <div class="card-b">Card B: border-box</div>

    <h2>3. Flexbox Navigation</h2>
    <nav>
        <span>My Website</span>
        <div class="links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <h2>4. CSS Grid Gallery</h2>
    <div class="gallery">
        <div class="card">Card 1</div>
        <div class="card">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>
        <div class="card">Card 5</div>
        <div class="card">Card 6</div>
    </div>

    <h2>5. Responsive Layout</h2>
    <div class="layout">
        <aside>Sidebar</aside>
        <main>Main content</main>
    </div>

</body>
</html>
