<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare - Web Tech 2026</title>
    <link rel="stylesheet" href="../CSS/register_style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Creeaza un cont</h1>

            <form class="register-form" action="#" method="post" enctype="multipart/form-data">
                <div class="row">
                    <label for="username">Nume utilizator</label>
                    <input type="text" id="username" name="username" placeholder="ex: Lofyye" required>
                </div>

                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="student@e-uvt.ro" required>
                </div>

                <div class="row two-col">
                    <div>
                        <label for="password">Parola</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirm_password">Confirma parola</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>

                <div class="row two-col">
                    <div>
                        <label for="dob">Data nasterii</label>
                        <input type="date" id="dob" name="dob">
                    </div>
                    <div>
                        <label for="country">Țară</label>
                        <select id="country" name="country">
                            <option value="ro">România</option>
                            <option value="md">Republica Moldova</option>
                            <option value="other">Altă țară</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <label>Gen</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male"> Masculin</label>
                        <label><input type="radio" name="gender" value="female"> Feminin</label>
                        <label><input type="radio" name="gender" value="other"> Altul</label>
                    </div>
                </div>

                <div class="row">
                    <label>Pasiuni / Hobbies</label>
                    <div class="checkbox-grid">
                        <label><input type="checkbox" name="hobbies" value="web"> Web Dev</label>
                        <label><input type="checkbox" name="hobbies" value="design"> UI/UX Design</label>
                        <label><input type="checkbox" name="hobbies" value="ai"> AI & ML</label>
                    </div>
                </div>

                <div class="row">
                    <label for="avatar">Poza de profil</label>
                    <input type="file" id="avatar" name="avatar" accept="image/*">
                </div>

                <div class="actions">
                    <button type="submit" class="btn primary">Inregistrare</button>
                    <button type="reset" class="btn ghost">Reseteaza</button>
                </div>

                <p class="login-link">
                    Ai deja cont? <a href="login.html">Mergi la login</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
